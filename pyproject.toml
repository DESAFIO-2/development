[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "challenge2"
version = "0.1.0"
description = "SUS Cidadão (NavegaSUS) - Copiloto de IA para Acesso Gratuito a Medicamentos e Exames no SUS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Samuel de Souza Rodrigues", email = "samucabsb@gmail.com" },
    { name = "Mickeias Charles de Oliveira Paiva" },
    { name = "Marlon Dias Marques" },
    { name = "Jhiovana Silva Ribeiro" },
    { name = "Tayrine Hevellin Zitkoski", email = "tayrinehz@gmail.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1"
]
eval = [
    "ragas>=0.1.9",
    "datasets>=2.19.0"
]
observability = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0"
]
ui = [
    "streamlit>=1.35.0"
]
multimodal = [
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.1",
    "pytesseract>=0.3.10"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["challenge2*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
