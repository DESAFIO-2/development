name: security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Toda segunda às 09:00 UTC: pega CVE nova em dependência que não mudou.
    - cron: "0 9 * * 1"

# Menor privilégio: o workflow só lê o repositório.
permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.0"

jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico inteiro, senão o gitleaks não vê os commits
      - name: Instalar gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Procurar segredos
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # No PR, só os commits novos: não culpa o PR por algo antigo.
            ./gitleaks git . --redact --log-opts="${BASE}..${HEAD}"
          else
            ./gitleaks git . --redact
          fi

  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Exportar dependências travadas do backend (runtime)
        working-directory: backend
        run: uv export --frozen --no-hashes --no-emit-project -o /tmp/requirements-backend.txt
      - name: Auditar CVEs conhecidas no backend (zero exceções)
        run: uvx pip-audit -r /tmp/requirements-backend.txt --progress-spinner off
      - name: Exportar dependências travadas de evals (offline, isolado)
        working-directory: evals
        run: uv export --frozen --no-hashes --no-emit-project -o /tmp/requirements-evals.txt
      - name: Auditar CVEs conhecidas em evals (exceções explícitas documentadas)
        # Limitação transitória do ambiente offline evals/: ragas==0.4.3 exige
        # langchain<1 (evals/pyproject.toml). As 7 CVEs abaixo correspondem aos
        # 6 pacotes travados no ramo 0.3.x / 0.4.3 sem fix compatível (ver
        # docs/security/matriz_cves_evals.md). Qualquer CVE nova em evals/ falha o CI.
        run: |
          uvx pip-audit -r /tmp/requirements-evals.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-2447 \
            --ignore-vuln PYSEC-2026-2192 \
            --ignore-vuln PYSEC-2026-2193 \
            --ignore-vuln PYSEC-2026-2562 \
            --ignore-vuln PYSEC-2026-77 \
            --ignore-vuln PYSEC-2026-76 \
            --ignore-vuln PYSEC-2026-3046

  dependencias-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Instalar dependências travadas
        run: npm ci --ignore-scripts
      - name: Auditar CVEs do app (alta e crítica bloqueiam)
        # Em 26/11/2026 restam 5 moderadas no minimatch, puxado pelo tooling do
        # Expo SDK 58; o "fix" do npm rebaixaria para o SDK 52. Revisar a cada SDK.
        run: npm audit --omit=dev --audit-level=high

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Análise estática de segurança (média e alta)
        run: uvx bandit -r backend/app evals -x "evals/.venv,backend/.venv" -ll

  semgrep:
    # Complementa o Bandit no Python e cobre o TypeScript do app (sem conta Semgrep).
    runs-on: ubuntu-latest
    env:
      SEMGREP_VERSION: "1.187.0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Semgrep (regras públicas; só severidade ERROR bloqueia)
        run: >
          uvx "semgrep==${SEMGREP_VERSION}" scan
          --config p/python --config p/typescript --config p/react --config p/secrets
          --severity ERROR --error --metrics off
          --exclude "**/node_modules/**" --exclude "**/.venv/**" --exclude "evals/reports/**"
          backend/app mobile/src

  imagem:
    # CVEs do sistema e das libs dentro da imagem Docker que vai para produção.
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: "0.76.2"
    steps:
      - uses: actions/checkout@v7
      - name: Build da imagem
        run: docker build -t remedia-backend:scan -f backend/Dockerfile .
      - name: Trivy (alta e crítica com correção disponível bloqueiam)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            remedia-backend:scan

  anti-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Instalar dependências
        run: uv sync --locked --project backend
      - name: Red team de prompt injection (texto, PDF e voz)
        # Meta 100% no conjunto de desenvolvimento: protege contra regressão.
        # Generalização se mede no holdout, que fica fora do repositório.
        run: >
          uv run --project backend python evals/runners/guardrail_runner.py
          --alvo app.seguranca.injecao:deve_bloquear
          --dataset evals/datasets/injecao_v1.jsonl
          --min-recall 1.0 --max-falso-bloqueio 0.0
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-anti-injection
          path: evals/reports/guardrail_ultimo.json

  dast:
    # ZAP (API scan) + Schemathesis contra a API num container efêmero.
    # Gratuito, sem LLM. Mesmo script do `make dast` local.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Bloqueia o merge desde a primeira triagem (25/11/2026). Exceções do
    # Schemathesis, com motivo, em scripts/seguranca/schemathesis.toml.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: ZAP e Schemathesis
        run: bash scripts/seguranca/dast.sh
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-dast
          path: output/dast/
          retention-days: 14
