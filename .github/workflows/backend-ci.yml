name: backend-ci

on:
  pull_request:
    paths: ["backend/**", "evals/**", "observability/**", "data/processed/**", "data/manifests/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "evals/**", "observability/**", "data/processed/**", "data/manifests/**", ".github/workflows/backend-ci.yml"]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres efêmero só para o contrato do repositório de usuários
    # (tests/integration/test_usuario_repository_contrato.py). Some com o job.
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: remedia_ci
          POSTGRES_USER: remedia_ci
          POSTGRES_PASSWORD: ci-somente-teste-efemero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remedia_ci -d remedia_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_TESTE_DATABASE_URL: postgresql://remedia_ci:ci-somente-teste-efemero@127.0.0.1:5432/remedia_ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Instalar dependências
        run: uv sync --locked
      - name: Formatação
        run: uv run ruff format --check . ../evals ../observability
      - name: Lint
        run: uv run ruff check . ../evals ../observability
      - name: Tipos
        run: uv run mypy app tests ../evals/runners ../evals/baselines ../observability
      - name: Testes
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v7
      - name: Build da imagem
        run: docker build -t sus-cidadao-backend:ci -f backend/Dockerfile .
      - name: Validar corpus dentro da imagem
        run: |
          docker run --rm --entrypoint python sus-cidadao-backend:ci -c '
          from app.api.routes.prescriptions import autocomplete_medications
          assert autocomplete_medications("losartana", 1).total_encontrados == 1
          '
      - name: Validar servidor HTTP no container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs sus-cidadao-smoke; docker rm -f sus-cidadao-smoke' EXIT
          docker run -d --name sus-cidadao-smoke -p 127.0.0.1:8000:8000 sus-cidadao-backend:ci
          python3 backend/tests/smoke_http.py --base-url http://127.0.0.1:8000
