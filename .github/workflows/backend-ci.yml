name: backend-ci

on:
  pull_request:
    paths: ["backend/**", "evals/**", "observability/**", "data/processed/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "evals/**", "observability/**", "data/processed/**", ".github/workflows/backend-ci.yml"]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Instalar dependências
        run: uv sync --locked
      - name: Formatação
        run: uv run ruff format --check . ../evals ../observability
      - name: Lint
        run: uv run ruff check . ../evals ../observability
      - name: Tipos
        run: uv run mypy app tests ../evals/runners ../evals/baselines ../observability
      - name: Testes
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v7
      - name: Build da imagem
        run: docker build -t sus-cidadao-backend:ci -f backend/Dockerfile .
      - name: Validar corpus dentro da imagem
        run: |
          docker run --rm --entrypoint python sus-cidadao-backend:ci -c '
          from app.api.routes.prescriptions import autocomplete_medications
          assert autocomplete_medications("losartana", 1).total_encontrados == 1
          '
