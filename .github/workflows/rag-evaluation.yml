name: rag-evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "evals/**"
      - "backend/**"
      - "data/processed/**"
      - "data/manifests/**"
      - "observability/**"
      - ".github/workflows/rag-evaluation.yml"

jobs:
  benchmark-deterministico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Instalar dependências
        run: uv sync --locked --project backend
      - name: Validar datasets de avaliação
        run: uv run --project backend python evals/runners/validar_datasets.py
      - name: Benchmark determinístico v1
        run: make benchmark
      - name: Benchmark consolidado v2 (Corpus v5)
        run: make benchmark DATASET=evals/datasets/golden_set_v2_consolidado.jsonl
      - name: Smoke sintético do protocolo Semana 3 (não mede LLM)
        run: make compare-smoke DATASET=evals/datasets/golden_set_v2_consolidado.jsonl
      - name: Guardar relatórios do benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-deterministico
          path: |
            evals/reports/rag_benchmark_golden_set_*.json
            evals/reports/smoke_sintetico_semana3_*/**
