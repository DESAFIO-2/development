[project]
name = "sus-cidadao-backend"
version = "0.1.0"
description = "Backend do SUS Cidadão (Challenge 2 - Residência em IA UnB)"
readme = "README.md"
authors = [
    { name = "Tayrine", email = "tayrinehz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
